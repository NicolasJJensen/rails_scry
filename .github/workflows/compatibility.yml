name: Compatibility

on:
  push:
  pull_request:

jobs:
  lint:
    name: Focused lint gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rake lint

  postgres-regression:
    name: Rails ${{ matrix.rails }} / Ruby ${{ matrix.ruby }} / PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scry_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - rails: "7.1"
            ruby: "3.1"
          - rails: "7.2"
            ruby: "3.2"
          - rails: "8.0"
            ruby: "3.3"
          - rails: "8.1"
            ruby: "3.3"
    env:
      BUNDLE_GEMFILE: gemfiles/rails.gemfile
      RAILS_VERSION: ${{ matrix.rails }}
      RAILS_ENV: test
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: scry_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: ${{ matrix.rails }}
      - run: bundle exec rake db:setup
      - run: bundle exec rspec

  adapter-core:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }} / ${{ matrix.adapter }} contracts
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: scry_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - rails: "7.1"
            ruby: "3.1"
            adapter: sqlite3
          - rails: "7.1"
            ruby: "3.1"
            adapter: mysql2
          - rails: "7.2"
            ruby: "3.2"
            adapter: sqlite3
          - rails: "7.2"
            ruby: "3.2"
            adapter: mysql2
          - rails: "8.0"
            ruby: "3.3"
            adapter: sqlite3
          - rails: "8.0"
            ruby: "3.3"
            adapter: mysql2
          - rails: "8.1"
            ruby: "3.3"
            adapter: sqlite3
          - rails: "8.1"
            ruby: "3.3"
            adapter: mysql2
    env:
      BUNDLE_GEMFILE: gemfiles/adapters.gemfile
      RAILS_VERSION: ${{ matrix.rails }}
      RAILS_ENV: test
      SCRY_ADAPTER: ${{ matrix.adapter }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: ${{ matrix.rails }}-${{ matrix.adapter }}
      - name: Run adapter-neutral association and aggregate contracts
        run: bundle exec ruby script/compatibility.rb
      - name: Run shared boundary and integration regressions
        run: bundle exec ruby script/adapter_regressions.rb
      - name: Validate public type declarations
        run: bundle exec rbs -I sig validate
